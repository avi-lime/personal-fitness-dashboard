# Local development database. Production uses a managed Postgres (see README).
services:
  db:
    image: postgres:16-alpine
    container_name: life-dashboard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: life_dashboard
    ports:
      - "5433:5432"
    volumes:
      - life-dashboard-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d life_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  life-dashboard-pgdata:
